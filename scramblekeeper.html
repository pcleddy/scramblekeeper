<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ScrambleKeeper</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: #1a1a2e;
    color: #eee;
    min-height: 100vh;
    padding: 20px;
  }
  h1 {
    text-align: center;
    font-size: 1.6rem;
    margin-bottom: 6px;
    letter-spacing: 2px;
    color: #f0c040;
  }
  .subtitle {
    text-align: center;
    font-size: 0.85rem;
    color: #888;
    margin-bottom: 20px;
  }

  /* Timer bar */
  .timer-bar {
    max-width: 960px;
    margin: 0 auto 18px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
  }
  .timer-display {
    font-size: 2rem;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    min-width: 90px;
    text-align: center;
    color: #eee;
    transition: color 0.3s;
  }
  .timer-display.warning { color: #f0c040; }
  .timer-display.danger { color: #e74c3c; }
  .timer-display.over { color: #e74c3c; animation: pulse 0.8s infinite; }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }
  .timer-progress-wrap {
    flex: 1;
    max-width: 400px;
    height: 8px;
    background: #0f1a30;
    border-radius: 4px;
    overflow: hidden;
  }
  .timer-progress {
    height: 100%;
    background: #4ecca3;
    border-radius: 4px;
    transition: width 0.25s linear, background 0.3s;
  }
  .timer-progress.warning { background: #f0c040; }
  .timer-progress.danger { background: #e74c3c; }
  .timer-btn {
    background: #16213e;
    color: #ccc;
    border: 1px solid #333;
    border-radius: 8px;
    padding: 6px 14px;
    cursor: pointer;
    font-size: 0.85rem;
  }
  .timer-btn:hover { border-color: #f0c040; color: #f0c040; }
  .timer-btn.active { border-color: #4ecca3; color: #4ecca3; }
  .timer-setting {
    display: flex;
    align-items: center;
    gap: 4px;
    font-size: 0.8rem;
    color: #666;
  }
  .timer-setting select {
    background: #0f1a30;
    color: #ccc;
    border: 1px solid #333;
    border-radius: 4px;
    padding: 3px 6px;
    font-size: 0.8rem;
    outline: none;
  }

  .board {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 16px;
    max-width: 960px;
    margin: 0 auto 24px;
  }
  .player-card {
    background: #16213e;
    border-radius: 12px;
    padding: 16px;
    border: 2px solid transparent;
    transition: border-color 0.2s;
  }
  .player-card.active { border-color: #f0c040; }
  .player-card.winner { border-color: #4ecca3; box-shadow: 0 0 20px rgba(78,204,163,0.3); }
  .player-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
  }
  .player-name {
    font-size: 1rem;
    font-weight: 600;
    background: none;
    border: none;
    color: #eee;
    width: 120px;
    border-bottom: 1px dashed #444;
    padding: 2px 4px;
    outline: none;
  }
  .player-name:focus { border-bottom-color: #f0c040; }
  .total-score {
    font-size: 1.8rem;
    font-weight: 700;
    color: #f0c040;
  }
  .player-card.winner .total-score { color: #4ecca3; }
  .turns {
    max-height: 180px;
    overflow-y: auto;
    margin-bottom: 10px;
    scrollbar-width: thin;
    scrollbar-color: #333 transparent;
  }
  .turn-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 3px 6px;
    border-radius: 4px;
    font-size: 0.85rem;
  }
  .turn-row:nth-child(odd) { background: rgba(255,255,255,0.03); }
  .turn-score { font-weight: 600; }
  .turn-score.negative { color: #e74c3c; }
  .turn-running { color: #777; font-size: 0.75rem; }
  .turn-del {
    background: none; border: none; color: #555; cursor: pointer;
    font-size: 0.75rem; padding: 0 4px;
  }
  .turn-del:hover { color: #e74c3c; }
  .add-score {
    display: flex;
    gap: 8px;
  }
  .add-score input {
    flex: 1;
    background: #0f1a30;
    border: 1px solid #333;
    border-radius: 6px;
    color: #eee;
    padding: 8px 10px;
    font-size: 0.95rem;
    outline: none;
  }
  .add-score input:focus { border-color: #f0c040; }
  .add-score button {
    background: #f0c040;
    color: #1a1a2e;
    border: none;
    border-radius: 6px;
    padding: 8px 14px;
    font-weight: 700;
    cursor: pointer;
    font-size: 0.95rem;
  }
  .add-score button:hover { background: #f7d060; }
  .controls {
    display: flex;
    justify-content: center;
    gap: 12px;
    flex-wrap: wrap;
    max-width: 960px;
    margin: 0 auto;
  }
  .controls button {
    background: #16213e;
    color: #ccc;
    border: 1px solid #333;
    border-radius: 8px;
    padding: 8px 18px;
    cursor: pointer;
    font-size: 0.85rem;
  }
  .controls button:hover { border-color: #f0c040; color: #f0c040; }
  .controls button.danger:hover { border-color: #e74c3c; color: #e74c3c; }
  .round-indicator {
    text-align: center;
    color: #888;
    font-size: 0.85rem;
    margin-bottom: 14px;
  }
  .crown { font-size: 1rem; }

  /* History panel */
  .history-toggle {
    position: fixed;
    top: 20px;
    right: 20px;
    background: #16213e;
    color: #f0c040;
    border: 1px solid #f0c040;
    border-radius: 8px;
    padding: 8px 14px;
    cursor: pointer;
    font-size: 0.85rem;
    font-weight: 600;
    z-index: 1000;
  }
  .history-toggle:hover { background: #f0c040; color: #1a1a2e; }
  .history-panel {
    position: fixed;
    top: 0;
    right: -420px;
    width: 400px;
    height: 100vh;
    background: #0f1a30;
    border-left: 2px solid #333;
    z-index: 999;
    transition: right 0.3s ease;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .history-panel.open { right: 0; }
  .history-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 18px 20px 14px;
    border-bottom: 1px solid #222;
  }
  .history-header h2 {
    font-size: 1.1rem;
    color: #f0c040;
    font-weight: 700;
  }
  .history-close {
    background: none;
    border: none;
    color: #666;
    font-size: 1.4rem;
    cursor: pointer;
    padding: 0 4px;
  }
  .history-close:hover { color: #eee; }
  .history-stats {
    padding: 12px 20px;
    border-bottom: 1px solid #222;
    font-size: 0.8rem;
    color: #888;
    display: flex;
    gap: 16px;
  }
  .history-stats span { color: #ccc; font-weight: 600; }
  .history-list {
    flex: 1;
    overflow-y: auto;
    padding: 10px 16px;
    scrollbar-width: thin;
    scrollbar-color: #333 transparent;
  }
  .history-empty {
    text-align: center;
    color: #555;
    padding: 40px 20px;
    font-size: 0.9rem;
  }
  .history-game {
    background: #16213e;
    border-radius: 10px;
    padding: 14px;
    margin-bottom: 10px;
    border: 1px solid #222;
  }
  .history-game-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
  }
  .history-game-date {
    font-size: 0.8rem;
    color: #888;
  }
  .history-game-rounds {
    font-size: 0.75rem;
    color: #666;
  }
  .history-game-del {
    background: none;
    border: none;
    color: #444;
    cursor: pointer;
    font-size: 0.75rem;
    padding: 2px 6px;
  }
  .history-game-del:hover { color: #e74c3c; }
  .history-player-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 3px 0;
    font-size: 0.85rem;
  }
  .history-player-name {
    flex: 1;
  }
  .history-player-score {
    font-weight: 700;
    min-width: 50px;
    text-align: right;
  }
  .history-player-row.winner .history-player-name { color: #4ecca3; }
  .history-player-row.winner .history-player-score { color: #4ecca3; }
  .history-player-row.winner::before {
    content: '\265B ';
    color: #4ecca3;
    font-size: 0.8rem;
  }
  .history-clear {
    padding: 12px 20px;
    border-top: 1px solid #222;
  }
  .history-clear button {
    width: 100%;
    background: #16213e;
    color: #888;
    border: 1px solid #333;
    border-radius: 6px;
    padding: 8px;
    cursor: pointer;
    font-size: 0.8rem;
  }
  .history-clear button:hover { border-color: #e74c3c; color: #e74c3c; }

  /* Leaderboard section in history */
  .leaderboard {
    padding: 12px 20px;
    border-bottom: 1px solid #222;
  }
  .leaderboard h3 {
    font-size: 0.85rem;
    color: #888;
    margin-bottom: 6px;
    font-weight: 600;
  }
  .lb-row {
    display: flex;
    justify-content: space-between;
    font-size: 0.82rem;
    padding: 2px 0;
  }
  .lb-wins { color: #4ecca3; font-weight: 600; }
  .lb-avg { color: #888; }
</style>
</head>
<body>

<h1>SCRAMBLEKEEPER</h1>
<p class="subtitle">Scrabble Score Tracker</p>
<div class="round-indicator" id="roundInfo">Round 1</div>

<!-- Timer -->
<div class="timer-bar" id="timerBar">
  <button class="timer-btn" id="timerToggle" onclick="toggleTimer()">Start</button>
  <div class="timer-display" id="timerDisplay">2:00</div>
  <div class="timer-progress-wrap">
    <div class="timer-progress" id="timerProgress" style="width:100%"></div>
  </div>
  <button class="timer-btn" id="timerReset" onclick="resetTimer()">Reset</button>
  <div class="timer-setting">
    <select id="timerDuration" onchange="changeTimerDuration()">
      <option value="60">1 min</option>
      <option value="120" selected>2 min</option>
      <option value="180">3 min</option>
      <option value="300">5 min</option>
      <option value="0">Off</option>
    </select>
  </div>
</div>

<div class="board" id="board"></div>
<div class="controls">
  <button onclick="undoLast()">Undo Last</button>
  <button onclick="endGame()">End Game (deduct tiles)</button>
  <button class="danger" onclick="newGame()">New Game</button>
</div>

<!-- History toggle button -->
<button class="history-toggle" id="historyToggle" onclick="toggleHistory()">
  History <span id="historyCount"></span>
</button>

<!-- History panel -->
<div class="history-panel" id="historyPanel">
  <div class="history-header">
    <h2>Game History</h2>
    <button class="history-close" onclick="toggleHistory()">&times;</button>
  </div>
  <div class="history-stats" id="historyStats"></div>
  <div class="leaderboard" id="leaderboard"></div>
  <div class="history-list" id="historyList"></div>
  <div class="history-clear">
    <button onclick="clearHistory()">Clear All History</button>
  </div>
</div>

<script>
const SAVE_KEY = 'scramblekeeper';
const HISTORY_KEY = 'scramblekeeper_history';
let state = loadState() || freshState();
let history = loadHistory();

// Timer state
let timerDuration = 120;
let timerRemaining = 120;
let timerRunning = false;
let timerInterval = null;
let timerAudioCtx = null;

function freshState() {
  return {
    players: [
      { name: 'Player 1', turns: [] },
      { name: 'Player 2', turns: [] },
      { name: 'Player 3', turns: [] },
      { name: 'Player 4', turns: [] }
    ],
    currentPlayer: 0,
    ended: false
  };
}

function loadState() {
  try {
    const s = localStorage.getItem(SAVE_KEY);
    return s ? JSON.parse(s) : null;
  } catch { return null; }
}

function save() {
  localStorage.setItem(SAVE_KEY, JSON.stringify(state));
}

function loadHistory() {
  try {
    const h = localStorage.getItem(HISTORY_KEY);
    return h ? JSON.parse(h) : [];
  } catch { return []; }
}

function saveHistory() {
  localStorage.setItem(HISTORY_KEY, JSON.stringify(history));
}

function total(player) {
  return player.turns.reduce((s, t) => s + t, 0);
}

function currentRound() {
  const counts = state.players.map(p => p.turns.length);
  return Math.min(...counts) + 1;
}

function leadingPlayer() {
  let best = -Infinity, idx = -1;
  state.players.forEach((p, i) => {
    const t = total(p);
    if (t > best) { best = t; idx = i; }
  });
  return idx;
}

// --- History functions ---
function saveGameToHistory() {
  // only save if at least one player has a turn
  if (state.players.every(p => p.turns.length === 0)) return;

  const record = {
    id: Date.now(),
    date: new Date().toISOString(),
    rounds: Math.max(...state.players.map(p => p.turns.length)),
    players: state.players.map(p => ({
      name: p.name,
      score: total(p),
      turns: [...p.turns]
    }))
  };

  // determine winner
  let best = -Infinity;
  record.players.forEach(p => { if (p.score > best) best = p.score; });
  record.players.forEach(p => { p.winner = p.score === best; });

  history.unshift(record);
  saveHistory();
  updateHistoryBadge();
}

function deleteGameFromHistory(id) {
  history = history.filter(g => g.id !== id);
  saveHistory();
  renderHistory();
}

function clearHistory() {
  if (!confirm('Delete all game history? This cannot be undone.')) return;
  history = [];
  saveHistory();
  renderHistory();
}

function toggleHistory() {
  document.getElementById('historyPanel').classList.toggle('open');
  renderHistory();
}

function updateHistoryBadge() {
  const el = document.getElementById('historyCount');
  el.textContent = history.length > 0 ? `(${history.length})` : '';
}

function renderHistory() {
  const list = document.getElementById('historyList');
  const stats = document.getElementById('historyStats');
  const lb = document.getElementById('leaderboard');

  // Stats
  if (history.length === 0) {
    stats.innerHTML = 'No games played yet';
    lb.style.display = 'none';
  } else {
    const allScores = history.flatMap(g => g.players.map(p => p.score));
    const highScore = Math.max(...allScores);
    const avgScore = Math.round(allScores.reduce((a, b) => a + b, 0) / allScores.length);
    stats.innerHTML = `
      Games: <span>${history.length}</span> &nbsp;|&nbsp;
      High score: <span>${highScore}</span> &nbsp;|&nbsp;
      Avg: <span>${avgScore}</span>
    `;

    // Leaderboard - win counts and average scores per player
    const playerStats = {};
    history.forEach(g => {
      g.players.forEach(p => {
        if (!playerStats[p.name]) playerStats[p.name] = { wins: 0, totalScore: 0, games: 0 };
        playerStats[p.name].games++;
        playerStats[p.name].totalScore += p.score;
        if (p.winner) playerStats[p.name].wins++;
      });
    });

    const sorted = Object.entries(playerStats).sort((a, b) => b[1].wins - a[1].wins || (b[1].totalScore / b[1].games) - (a[1].totalScore / a[1].games));

    lb.style.display = 'block';
    lb.innerHTML = '<h3>All-Time Leaderboard</h3>' + sorted.map(([name, s]) =>
      `<div class="lb-row">
        <span>${name}</span>
        <span><span class="lb-wins">${s.wins}W</span> <span class="lb-avg">(avg ${Math.round(s.totalScore / s.games)})</span></span>
      </div>`
    ).join('');
  }

  // Game list
  if (history.length === 0) {
    list.innerHTML = '<div class="history-empty">Finished games will appear here.<br>Use "End Game" or "New Game" to save.</div>';
    return;
  }

  list.innerHTML = history.map(game => {
    const d = new Date(game.date);
    const dateStr = d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
    const timeStr = d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });

    const playersHtml = game.players
      .sort((a, b) => b.score - a.score)
      .map(p => `<div class="history-player-row ${p.winner ? 'winner' : ''}">
        <span class="history-player-name">${p.name}</span>
        <span class="history-player-score">${p.score}</span>
      </div>`).join('');

    return `<div class="history-game">
      <div class="history-game-header">
        <div>
          <div class="history-game-date">${dateStr} at ${timeStr}</div>
          <div class="history-game-rounds">${game.rounds} rounds</div>
        </div>
        <button class="history-game-del" onclick="deleteGameFromHistory(${game.id})" title="Delete">&times;</button>
      </div>
      ${playersHtml}
    </div>`;
  }).join('');

  updateHistoryBadge();
}

// --- Timer functions ---
function beep() {
  try {
    if (!timerAudioCtx) timerAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = timerAudioCtx.createOscillator();
    const gain = timerAudioCtx.createGain();
    osc.connect(gain);
    gain.connect(timerAudioCtx.destination);
    osc.frequency.value = 880;
    gain.gain.value = 0.3;
    osc.start();
    osc.stop(timerAudioCtx.currentTime + 0.15);
    setTimeout(() => {
      const osc2 = timerAudioCtx.createOscillator();
      const gain2 = timerAudioCtx.createGain();
      osc2.connect(gain2);
      gain2.connect(timerAudioCtx.destination);
      osc2.frequency.value = 660;
      gain2.gain.value = 0.3;
      osc2.start();
      osc2.stop(timerAudioCtx.currentTime + 0.25);
    }, 200);
  } catch(e) {}
}

function formatTime(secs) {
  const neg = secs < 0;
  const abs = Math.abs(secs);
  const m = Math.floor(abs / 60);
  const s = abs % 60;
  return (neg ? '-' : '') + m + ':' + String(s).padStart(2, '0');
}

function updateTimerUI() {
  const display = document.getElementById('timerDisplay');
  const progress = document.getElementById('timerProgress');
  const toggle = document.getElementById('timerToggle');

  if (timerDuration === 0) {
    display.textContent = '--:--';
    display.className = 'timer-display';
    progress.style.width = '100%';
    progress.className = 'timer-progress';
    toggle.textContent = '--';
    return;
  }

  display.textContent = formatTime(timerRemaining);
  toggle.textContent = timerRunning ? 'Pause' : 'Start';
  toggle.className = 'timer-btn' + (timerRunning ? ' active' : '');

  const pct = Math.max(0, (timerRemaining / timerDuration) * 100);
  progress.style.width = pct + '%';

  let cls = '';
  if (timerRemaining <= 0) cls = 'over';
  else if (timerRemaining <= 15) cls = 'danger';
  else if (timerRemaining <= 30) cls = 'warning';

  display.className = 'timer-display' + (cls ? ' ' + cls : '');
  progress.className = 'timer-progress' + (cls ? ' ' + cls : '');
}

function tickTimer() {
  timerRemaining--;
  if (timerRemaining === 0) beep();
  updateTimerUI();
}

function startTimer() {
  if (timerDuration === 0) return;
  if (timerRunning) return;
  timerRunning = true;
  timerInterval = setInterval(tickTimer, 1000);
  updateTimerUI();
}

function stopTimer() {
  timerRunning = false;
  clearInterval(timerInterval);
  timerInterval = null;
  updateTimerUI();
}

function toggleTimer() {
  if (timerDuration === 0) return;
  if (timerRunning) stopTimer();
  else startTimer();
}

function resetTimer() {
  stopTimer();
  timerRemaining = timerDuration;
  updateTimerUI();
}

function changeTimerDuration() {
  const sel = document.getElementById('timerDuration');
  timerDuration = parseInt(sel.value);
  stopTimer();
  timerRemaining = timerDuration;
  updateTimerUI();
}

function autoStartTimer() {
  if (timerDuration === 0) return;
  stopTimer();
  timerRemaining = timerDuration;
  startTimer();
}

// --- Game functions ---
function render() {
  const board = document.getElementById('board');
  board.innerHTML = '';
  const leader = state.ended ? leadingPlayer() : -1;

  state.players.forEach((player, pi) => {
    const card = document.createElement('div');
    card.className = 'player-card' +
      (pi === state.currentPlayer && !state.ended ? ' active' : '') +
      (pi === leader && state.ended ? ' winner' : '');

    let turnsHtml = '';
    let running = 0;
    player.turns.forEach((score, ti) => {
      running += score;
      turnsHtml += `<div class="turn-row">
        <span>Turn ${ti + 1}</span>
        <span class="turn-score ${score < 0 ? 'negative' : ''}">${score >= 0 ? '+' : ''}${score}</span>
        <span class="turn-running">${running}</span>
        ${!state.ended ? `<button class="turn-del" onclick="delTurn(${pi},${ti})" title="Delete">&times;</button>` : ''}
      </div>`;
    });

    card.innerHTML = `
      <div class="player-header">
        <input class="player-name" value="${player.name}" onchange="rename(${pi}, this.value)"
          ${state.ended ? 'disabled' : ''}>
        <span class="total-score">${pi === leader && state.ended ? '<span class="crown">&#9819;</span> ' : ''}${total(player)}</span>
      </div>
      <div class="turns">${turnsHtml}</div>
      ${!state.ended ? `<div class="add-score">
        <input type="number" id="input-${pi}" placeholder="Score" onkeydown="if(event.key==='Enter')addScore(${pi})">
        <button onclick="addScore(${pi})">+</button>
      </div>` : ''}
    `;
    board.appendChild(card);
  });

  document.getElementById('roundInfo').textContent =
    state.ended ? 'Game Over!' : `Round ${currentRound()} \u2014 ${state.players[state.currentPlayer].name}'s turn`;

  document.querySelectorAll('.turns').forEach(el => el.scrollTop = el.scrollHeight);
  save();
}

function addScore(pi) {
  const input = document.getElementById(`input-${pi}`);
  const val = parseInt(input.value);
  if (isNaN(val)) return;
  state.players[pi].turns.push(val);
  input.value = '';
  state.currentPlayer = (pi + 1) % 4;
  render();
  autoStartTimer();
}

function delTurn(pi, ti) {
  state.players[pi].turns.splice(ti, 1);
  render();
}

function rename(pi, name) {
  state.players[pi].name = name || `Player ${pi + 1}`;
  save();
}

function undoLast() {
  let lastPi = (state.currentPlayer - 1 + 4) % 4;
  for (let i = 0; i < 4; i++) {
    if (state.players[lastPi].turns.length > 0) break;
    lastPi = (lastPi - 1 + 4) % 4;
  }
  if (state.players[lastPi].turns.length > 0) {
    state.players[lastPi].turns.pop();
    state.currentPlayer = lastPi;
    state.ended = false;
    render();
    resetTimer();
  }
}

function endGame() {
  stopTimer();
  state.players.forEach(p => {
    const deduction = prompt(`Remaining tile points for ${p.name}? (Enter 0 if none)`, '0');
    const val = parseInt(deduction);
    if (!isNaN(val) && val > 0) {
      p.turns.push(-val);
    }
  });
  state.ended = true;
  render();
  saveGameToHistory();
}

function newGame() {
  if (!confirm('Start a new game? Current scores will be lost.')) return;
  // save current game to history if it has any turns
  if (!state.ended) saveGameToHistory();
  const names = state.players.map(p => p.name);
  state = freshState();
  state.players.forEach((p, i) => p.name = names[i]);
  resetTimer();
  render();
}

render();
updateTimerUI();
updateHistoryBadge();
</script>
